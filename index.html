<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        :root {
            --bg: #1687a3;
            --panel: #fffaf0;
            --panel-2: #f2eddf;
            --border: rgba(74, 80, 83, 0.25);
            --text: #263238;
            --muted: #58666d;
            --accent: #176b8a;
            --positive: #1f9d68;
            --negative: #d35b62;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, "Segoe UI", system-ui, sans-serif;
        }

        .dashboard {
            height: 100vh;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 10px;
            padding: 10px;
        }

        .panel {
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--panel);
        }

        .left-panel { padding: 20px 22px; }
        .right-panel {
            display: grid;
            grid-template-rows: 42% minmax(0, 1fr);
            gap: 10px;
            border: none;
            background: transparent;
        }

        .right-panel .panel { padding: 16px 18px; }

        .panel-header {
            height: 38px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        h1, h2 {
            margin: 0;
            letter-spacing: -0.02em;
        }

        h1 { font-size: 20px; }
        h2 { font-size: 16px; }

        .source-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 12px;
            white-space: nowrap;
        }

        .source-link:hover { color: var(--accent); }

        .news-list {
            height: calc(100% - 38px);
            margin: 0;
            padding: 0 6px 0 0;
            list-style: none;
            overflow-y: auto;
        }

        .news-item {
            display: grid;
            grid-template-columns: 80px minmax(0, 1fr);
            gap: 14px;
            align-items: center;
            min-height: 92px;
            border-top: 1px solid var(--border);
        }

        .news-item:last-child { border-bottom: 1px solid var(--border); }

        .news-time {
            color: var(--accent);
            font-size: 12px;
            font-variant-numeric: tabular-nums;
        }

        .news-item a {
            color: var(--text);
            text-decoration: none;
            font-size: 15px;
            line-height: 1.35;
        }

        .news-item a:hover { color: var(--accent); }

        .search-row {
            display: flex;
            gap: 8px;
        }

        .search-row input {
            min-width: 0;
            height: 38px;
            flex: 1;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            background: var(--panel-2);
            color: var(--text);
            padding: 0 12px;
        }

        .search-row input:focus { border-color: var(--accent); }

        .search-row button {
            height: 38px;
            border: 0;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            padding: 0 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .search-row button:disabled {
            cursor: not-allowed;
            opacity: 0.45;
        }

        .upper-panel {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }

        .upper-section {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
        }

        .clocks-section {
            padding-right: 14px;
            border-right: 1px solid var(--border);
        }

        .weather-section { padding-left: 14px; }

        .upper-section-header {
            height: 26px;
            display: flex;
            flex: none;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .upper-section-header h2 { font-size: 15px; }
        .upper-section-header .source-link { font-size: 11px; }

        .clock-search-box {
            position: relative;
            flex: none;
        }

        .clock-search-input {
            width: 100%;
            height: 36px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            background: var(--panel-2);
            color: var(--text);
            padding: 0 10px;
        }

        .clock-search-input:focus { border-color: var(--accent); }
        .clock-search-input:disabled { opacity: 0.6; }

        .clock-search-status {
            min-height: 14px;
            margin-top: 3px;
            color: var(--muted);
            font-size: 10px;
        }

        .clock-suggestions {
            position: absolute;
            z-index: 6;
            top: 100%;
            right: 0;
            left: 0;
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--panel);
            box-shadow: 0 12px 28px #0008;
        }

        .clock-suggestions[hidden] { display: none; }

        .clock-suggestion {
            display: block;
            width: 100%;
            border: 0;
            border-bottom: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            padding: 8px 10px;
            text-align: left;
            cursor: pointer;
        }

        .clock-suggestion:last-child { border-bottom: 0; }
        .clock-suggestion:hover,
        .clock-suggestion[aria-selected="true"] { background: var(--panel-2); }
        .clock-suggestion strong,
        .clock-suggestion span { display: block; }
        .clock-suggestion span { margin-top: 2px; color: var(--muted); font-size: 10px; }

        .clock-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-rows: repeat(2, minmax(0, 1fr));
            gap: 8px;
            min-height: 0;
            margin-top: 5px;
        }

        .clock-grid[data-count="1"] {
            grid-template-columns: minmax(0, 1fr);
            grid-template-rows: minmax(0, 1fr);
        }

        .clock-grid[data-count="2"] {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-rows: minmax(0, 1fr);
        }

        .clock-grid[data-count="3"] .clock-face,
        .clock-grid[data-count="4"] .clock-face { display: none; }

        .clock-grid[data-count="3"] .clock-card,
        .clock-grid[data-count="4"] .clock-card { grid-template-rows: auto minmax(0, 1fr); }

        .clock-grid[data-count="3"] .clock-time,
        .clock-grid[data-count="4"] .clock-time {
            font-size: clamp(22px, 3vh, 30px);
        }

        .clock-card {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            align-items: center;
            min-width: 0;
            min-height: 0;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--panel-2);
            padding: 6px;
        }

        .clock-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            min-width: 0;
        }

        .clock-place {
            overflow: hidden;
            color: var(--muted);
            font-size: 10px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .clock-remove {
            flex: none;
            border: 0;
            background: transparent;
            color: var(--muted);
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
        }

        .clock-remove:hover { color: var(--text); }

        .clock-face {
            position: relative;
            width: 142px;
            height: 142px;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 1;
            justify-self: center;
            border: 2px solid #536984;
            border-radius: 50%;
            background:
                radial-gradient(circle, var(--panel-2) 0 72%, transparent 73%),
                repeating-conic-gradient(from -0.3deg, #536984 0deg 0.5deg, transparent 0.5deg 6deg);
            box-shadow: inset 0 0 0 4px #d8d2c4, 0 2px 8px #0005;
        }

        .clock-face::after {
            position: absolute;
            z-index: 2;
            top: 50%;
            left: 50%;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            content: "";
            transform: translate(-50%, -50%);
        }

        .clock-number {
            position: absolute;
            z-index: 1;
            display: grid;
            width: 16px;
            height: 16px;
            place-items: center;
            border-radius: 50%;
            background: var(--panel-2);
            color: var(--text);
            font-size: 9px;
            font-weight: 700;
            line-height: 1;
        }

        .clock-number-12 { top: 7%; left: 50%; transform: translateX(-50%); }
        .clock-number-3 { top: 50%; right: 7%; transform: translateY(-50%); }
        .clock-number-6 { bottom: 7%; left: 50%; transform: translateX(-50%); }
        .clock-number-9 { top: 50%; left: 7%; transform: translateY(-50%); }

        .clock-hour-mark {
            position: absolute;
            z-index: 1;
            inset: 0;
            pointer-events: none;
            transform: rotate(var(--mark-angle));
        }

        .clock-hour-mark::before {
            position: absolute;
            top: 8%;
            left: 50%;
            width: 3px;
            height: 9%;
            border-radius: 2px;
            background: #657781;
            box-shadow: 0 0 3px #65778155;
            content: "";
            transform: translateX(-50%);
        }

        .clock-hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            border-radius: 999px;
            transform: translateX(-50%) rotate(var(--hand-angle));
            transform-origin: 50% 100%;
        }

        .clock-hand.hour {
            width: 4px;
            height: 20%;
            background: var(--text);
            --hand-angle: var(--hour-angle, 0deg);
        }

        .clock-hand.minute {
            width: 3px;
            height: 34%;
            background: #657781;
            --hand-angle: var(--minute-angle, 0deg);
        }

        .clock-hand.second {
            z-index: 1;
            width: 1px;
            height: 39%;
            background: var(--accent);
            --hand-angle: var(--second-angle, 0deg);
        }

        .clock-time {
            color: var(--text);
            font-size: clamp(18px, 2.4vh, 24px);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            text-align: center;
        }

        .weather-search-box {
            position: relative;
            flex: none;
        }

        .weather-current {
            display: flex;
            flex: none;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-height: clamp(42px, 6.5vh, 58px);
            padding: 5px 0;
        }

        .weather-current-info { min-width: 0; }

        .weather-current-reading {
            display: flex;
            flex: none;
            align-items: center;
            gap: 8px;
        }

        .weather-icon {
            font-size: clamp(20px, 3.2vh, 28px);
            line-height: 1;
        }

        .location-name {
            overflow: hidden;
            color: var(--text);
            font-size: clamp(13px, 1.9vh, 17px);
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .temperature {
            flex: none;
            font-size: clamp(26px, 4vh, 48px);
            line-height: 1;
            font-weight: 700;
            letter-spacing: -0.05em;
        }

        .hourly-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: clamp(66px, 9.5vh, 84px);
            border-top: 1px solid var(--border);
            padding-top: clamp(2px, 0.6vh, 5px);
        }

        .hourly-grid {
            display: grid;
            grid-template-rows: repeat(3, minmax(0, 1fr));
            flex: 1;
            min-height: 0;
            gap: clamp(1px, 0.25vh, 2px);
        }

        .hourly-row {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            align-items: center;
            min-width: 0;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            container-type: inline-size;
        }

        .hourly-cell {
            overflow: hidden;
            text-align: center;
            white-space: nowrap;
        }

        .hourly-time-row .hourly-cell { color: var(--muted); font-size: 10px; }
        .hourly-icon-row .hourly-cell { font-size: 16px; line-height: 1; }
        .hourly-temperature-row .hourly-cell {
            color: var(--text);
            font-size: 11px;
            font-weight: 700;
        }

        .hourly-weather-icon {
            display: inline-block;
            line-height: 1;
        }

        .hourly-weather-icon-composite {
            position: relative;
            width: 1em;
            height: 1em;
            vertical-align: middle;
        }

        .hourly-weather-icon-moon,
        .hourly-weather-icon-cloud {
            position: absolute;
            line-height: 1;
        }

        .hourly-weather-icon-moon {
            top: -1px;
            right: -1px;
            font-size: 0.55em;
        }

        .hourly-weather-icon-cloud {
            bottom: 0;
            left: 0;
            font-size: 0.8em;
        }

        @supports (font-size: 1cqw) {
            .hourly-time-row .hourly-cell { font-size: clamp(9px, 3.8cqw, 12px); }
            .hourly-icon-row .hourly-cell { font-size: clamp(10px, 5cqw, 18px); }
            .hourly-temperature-row .hourly-cell { font-size: clamp(9px, 4cqw, 13px); }
        }

        .forecast {
            flex: none;
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 2px;
            min-height: clamp(54px, 8vh, 76px);
            border-top: 1px solid var(--border);
            padding-top: clamp(2px, 0.5vh, 5px);
            container-type: inline-size;
        }

        .forecast-day {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(1px, 0.4vh, 3px);
            min-width: 0;
            border-left: 1px solid var(--border);
            font-size: 9px;
        }

        .forecast-day:first-child { border-left: 0; }
        .forecast-icon { font-size: 13px; }
        .forecast-temp {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2px;
            color: var(--text);
            font-size: 8px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
            white-space: normal;
        }

        .forecast-temp > span { white-space: nowrap; }

        @supports (font-size: 1cqw) {
            .forecast-day {
                gap: clamp(1px, min(0.8cqw, 0.4vh), 3px);
                font-size: clamp(7px, min(3.6cqw, 1.3vh), 11px);
            }
            .forecast-icon { font-size: clamp(10px, min(5cqw, 1.7vh), 15px); }
            .forecast-temp {
                gap: clamp(1px, min(0.6cqw, 0.3vh), 2px);
                font-size: clamp(6px, min(3.2cqw, 1.1vh), 10px);
            }
        }

        .market-header {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 12px;
            align-items: start;
        }

        .stock-search-box {
            position: relative;
            max-width: 360px;
            justify-self: end;
            width: 100%;
        }

        .stock-search-box .search-row { width: 100%; }
        .stock-search-box input { width: 100%; }

        .stock-suggestions {
            position: absolute;
            z-index: 5;
            top: calc(100% + 6px);
            right: 0;
            left: 0;
            max-height: 260px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--panel);
            box-shadow: 0 12px 28px #0008;
        }

        .stock-suggestions[hidden] { display: none; }

        .stock-suggestion {
            display: block;
            width: 100%;
            border: 0;
            border-bottom: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            padding: 10px 12px;
            text-align: left;
            cursor: pointer;
        }

        .stock-suggestion:last-child { border-bottom: 0; }
        .stock-suggestion:hover, .stock-suggestion[aria-selected="true"] { background: var(--panel-2); }
        .stock-suggestion strong, .stock-suggestion span { display: block; }
        .stock-suggestion span { margin-top: 3px; color: var(--muted); font-size: 11px; }
        .stock-search-status {
            min-height: 15px;
            margin-top: 4px;
            color: var(--muted);
            font-size: 11px;
        }

        .heatmap {
            height: calc(100% - 54px);
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            grid-template-rows: repeat(var(--row-count, 1), minmax(0, 1fr));
            gap: 7px;
            margin-top: 8px;
            min-height: 0;
        }

        .heatmap-row {
            display: flex;
            gap: 7px;
            min-width: 0;
            min-height: 0;
        }

        .stock-tile {
            position: relative;
            display: flex;
            flex: 1 1 0;
            flex-direction: column;
            justify-content: center;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            border: 0;
            border-radius: 7px;
            color: #fff;
            cursor: pointer;
            overflow: hidden;
            text-align: left;
            padding: 10px;
            transition: transform 120ms ease, filter 120ms ease;
        }

        .stock-tile:hover {
            transform: scale(0.985);
            filter: brightness(1.12);
        }

        .stock-tile strong {
            display: block;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: clamp(12px, 1.2vw, 17px);
        }

        .stock-tile span {
            display: block;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-top: 5px;
            font-size: clamp(11px, 1vw, 15px);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .stock-tile .stock-symbol {
            margin-top: 2px;
            font-size: 10px;
            font-weight: 400;
            opacity: 0.75;
        }

        .stock-tile small {
            position: absolute;
            right: 8px;
            bottom: 6px;
            opacity: 0;
            transition: opacity 120ms ease;
        }

        .stock-tile:hover small,
        .stock-tile:focus-visible small {
            opacity: 1;
        }

        .stock-tile.compact {
            padding: 6px;
        }

        .stock-tile.compact strong {
            font-size: 12px;
            line-height: 1.15;
        }

        .stock-tile.compact .stock-symbol {
            display: none;
        }

        .stock-tile.compact .stock-change {
            margin-top: 3px;
            font-size: 11px;
        }

        .stock-tile.micro {
            padding: 3px;
            text-align: center;
        }

        .stock-tile.micro strong {
            font-size: 10px;
            line-height: 1.1;
        }

        .stock-tile.micro .stock-symbol,
        .stock-tile.micro .stock-change {
            display: none;
        }

        .stock-tile.micro small {
            right: 3px;
            bottom: 1px;
            font-size: 12px;
        }

        .status {
            color: var(--muted);
            font-size: 11px;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

        @media (max-height: 700px) and (min-width: 621px) {
            .right-panel { grid-template-rows: 52% minmax(0, 1fr); }
            .weather-current { min-height: clamp(36px, 6vh, 42px); }
            .hourly-section { min-height: clamp(56px, 9vh, 68px); }
            .forecast { min-height: clamp(46px, 8vh, 58px); }
        }

        @media (max-height: 540px) and (min-width: 621px) {
            .right-panel { grid-template-rows: 58% minmax(0, 1fr); }
            .hourly-section { min-height: clamp(52px, 8.5vh, 60px); }
            .forecast { min-height: clamp(44px, 7.5vh, 50px); }
        }

        @media (max-height: 460px) and (min-width: 621px) {
            .right-panel { grid-template-rows: 70% minmax(0, 1fr); }
        }

        @media (max-width: 900px) {
            body { overflow: auto; }
            .dashboard {
                height: auto;
                min-height: 100vh;
                grid-template-columns: 1fr;
            }
            .left-panel { height: 70vh; }
            .right-panel { height: 100vh; }
        }

        @media (max-width: 620px) {
            .dashboard { padding: 6px; gap: 6px; }
            .right-panel {
                height: auto;
                min-height: 1200px;
                grid-template-rows: minmax(660px, 1fr) minmax(540px, 1fr);
            }
            .upper-panel {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: minmax(0, 0.9fr) minmax(0, 1.1fr);
            }
            .clocks-section {
                padding-right: 0;
                padding-bottom: 10px;
                border-right: 0;
                border-bottom: 1px solid var(--border);
            }
            .weather-section { padding-top: 10px; padding-left: 0; }
            .market-header { grid-template-columns: 1fr; }
            .stock-search-box { max-width: none; }
        }
    </style>
</head>
<body>
    <main class="dashboard">
        <section class="panel left-panel">
            <header class="panel-header">
                <h1>Notizie in tempo reale</h1>
                <span class="status" id="news-status">Aggiornamento...</span>
            </header>
            <ul class="news-list" id="news-list"></ul>
        </section>

        <section class="right-panel">
            <section class="panel upper-panel">
                <section class="upper-section clocks-section">
                    <header class="upper-section-header">
                        <h2>Orologi mondiali</h2>
                    </header>
                    <div class="clock-search-box">
                        <input id="clock-search" class="clock-search-input" type="search" placeholder="Cerca una città..." aria-label="Cerca una città per aggiungere un orologio" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="clock-suggestions" autocomplete="off">
                        <div class="clock-suggestions" id="clock-suggestions" role="listbox" aria-label="Località trovate" hidden></div>
                        <div class="clock-search-status" id="clock-search-status" role="status" aria-live="polite"></div>
                    </div>
                    <div class="clock-grid" id="clock-grid"></div>
                </section>

                <section class="upper-section weather-section">
                    <header class="upper-section-header">
                        <h2>Meteo</h2>
                    </header>
                    <div class="clock-search-box weather-search-box">
                        <input id="weather-search" class="clock-search-input" type="search" placeholder="Cerca una città..." aria-label="Cerca una città per visualizzare il meteo" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="weather-suggestions" autocomplete="off" spellcheck="false">
                        <div class="clock-suggestions weather-suggestions" id="weather-suggestions" role="listbox" aria-label="Località trovate" hidden></div>
                        <div class="clock-search-status weather-search-status" id="weather-search-status" role="status" aria-live="polite"></div>

                            <span class="weather-icon" id="weather-icon" role="img" aria-label="Condizione meteo"></span>
                        </div>
                    </div>
                    <section class="hourly-section">
                        <div class="hourly-grid" id="hourly-grid" role="table" aria-label="Orari, condizioni meteo e temperature in gradi centigradi nelle prossime 12 ore"></div>

            <section class="panel">
                <header class="market-header">
                    <div>
                        <h2>Heatmap mercati</h2>
                        <div class="stock-search-status" id="market-status" role="status" aria-live="polite">Connessione ai dati Trade Republic...</div>
                    </div>
                    <div class="stock-search-box">
                        <form class="search-row" id="stock-form" autocomplete="off">
                            <input id="stock-search" type="search" placeholder="Cerca un'azione su Trade Republic" aria-label="Cerca un'azione su Trade Republic" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="stock-suggestions">
                            <button id="stock-search-button" type="submit" disabled>Aggiungi</button>
                        </form>
                        <div class="stock-suggestions" id="stock-suggestions" role="listbox" aria-label="Azioni trovate" hidden></div>
                        <div class="stock-search-status" id="stock-search-status" role="status" aria-live="polite"></div>
                    </div>
                </header>
                <div class="heatmap" id="heatmap"></div>
            </section>
        </section>
    </main>

    <script>
        const STOCK_ISINS = {
            "AAPL": "US0378331005",
            "MSFT": "US5949181045",
            "NVDA": "US67066G1040",
            "GOOGL": "US02079K3059",
            "ENEL.MI": "IT0003128367",
            "ENI.MI": "IT0003132476",
            "STM.MI": "NL0000226223",
            "UCG.MI": "IT0005239360",
            "RACE.MI": "NL0011585146",
            "BMW.DE": "DE0005190003",
            "SAP.DE": "DE0007164600",
            "SIE.DE": "DE0007236101"
        };

        const DEFAULT_STOCKS = [
            { symbol: "AAPL", isin: STOCK_ISINS.AAPL, name: "Apple" },
            { symbol: "MSFT", isin: STOCK_ISINS.MSFT, name: "Microsoft" },
            { symbol: "NVDA", isin: STOCK_ISINS.NVDA, name: "NVIDIA" },
            { symbol: "GOOGL", isin: STOCK_ISINS.GOOGL, name: "Alphabet" },
            { symbol: "ENEL.MI", isin: STOCK_ISINS["ENEL.MI"], name: "Enel" },
            { symbol: "ENI.MI", isin: STOCK_ISINS["ENI.MI"], name: "Eni" },
            { symbol: "STM.MI", isin: STOCK_ISINS["STM.MI"], name: "STMicro" },
            { symbol: "UCG.MI", isin: STOCK_ISINS["UCG.MI"], name: "Unicredit" },
            { symbol: "RACE.MI", isin: STOCK_ISINS["RACE.MI"], name: "Ferrari" },
            { symbol: "BMW.DE", isin: STOCK_ISINS["BMW.DE"], name: "BMW" },
            { symbol: "SAP.DE", isin: STOCK_ISINS["SAP.DE"], name: "SAP" },
            { symbol: "SIE.DE", isin: STOCK_ISINS["SIE.DE"], name: "Siemens" }
        ];

        let stocks = loadStocks();
        const stockTileElements = new Map();

        function loadStocks() {
            try {
                const saved = JSON.parse(localStorage.getItem("dashboard-stocks"));
                if (Array.isArray(saved) && saved.length) {
                    return saved.map(stock => {
                        const symbol = String(stock.symbol || stock.isin || "").toUpperCase();
                        const isin = stock.isin || STOCK_ISINS[symbol] ||
                            (/^[A-Z]{2}[A-Z0-9]{10}$/.test(symbol) ? symbol : null);
                        return { ...stock, symbol, isin, change: null };
                    });
                }
            } catch {
                return DEFAULT_STOCKS.map(stock => ({ ...stock, change: null }));
            }
            return DEFAULT_STOCKS.map(stock => ({ ...stock, change: null }));
        }

        function saveStocks() {
            localStorage.setItem("dashboard-stocks", JSON.stringify(stocks.map(stock => ({
                symbol: stock.symbol,
                isin: stock.isin,
                name: stock.name
            }))));
        }

        function escapeHtml(value) {
            const div = document.createElement("div");
            div.textContent = value;
            return div.innerHTML;
        }

        async function loadNews() {
            const feeds = [
                "https://www.ansa.it/sito/notizie/topnews/topnews_rss.xml",
                "https://www.ansa.it/sito/notizie/economia/economia_rss.xml",
                "https://www.ansa.it/sito/notizie/mondo/mondo_rss.xml"
            ];
            const items = [];

            await Promise.all(feeds.map(async feed => {
                try {
                    const url = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(feed);
                    const response = await fetch(url);
                    const data = await response.json();
                    if (data.items) items.push(...data.items);
                } catch (_) {}
            }));

            items.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
            const unique = [];
            const seen = new Set();
            for (const item of items) {
                if (!seen.has(item.title)) {
                    seen.add(item.title);
                    unique.push(item);
                }
            }

            const list = document.getElementById("news-list");
            if (!unique.length) {
                list.innerHTML = "<li class=\"news-item\"><span class=\"news-time\">--:--</span><span>Impossibile caricare le notizie.</span></li>";
                document.getElementById("news-status").textContent = "Aggiornamento fallito";
                return;
            }

            list.innerHTML = unique.slice(0, 14).map(item => {
                const date = new Date(item.pubDate);
                const time = isNaN(date) ? "--:--" : date.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
                return `<li class="news-item">
                    <span class="news-time">${time}</span>
                    <a href="${escapeHtml(item.link)}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a>
                </li>`;
            }).join("");
            document.getElementById("news-status").textContent =
                "Aggiornato " + new Date().toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
        }

        const weatherCodes = {
            0: ["Sereno", "☀"], 1: ["Prevalentemente sereno", "🌤"], 2: ["Parzialmente nuvoloso", "🌤"],
            3: ["Nuvoloso", "☁"], 45: ["Nebbia", "☁"], 48: ["Nebbia con ghiaccio", "☁"],
            51: ["Pioggerella", "🌧"], 53: ["Pioggerella", "🌧"], 55: ["Pioggerella intensa", "🌧"],
            56: ["Pioggerella gelata", "🌧"], 57: ["Pioggerella gelata intensa", "🌧"],
            61: ["Pioggia leggera", "🌧"], 63: ["Pioggia", "🌧"], 65: ["Pioggia intensa", "🌧"],
            66: ["Pioggia gelata leggera", "🌧"], 67: ["Pioggia gelata intensa", "🌧"],
            71: ["Nevicate leggere", "☁"], 73: ["Nevicate", "☁"], 75: ["Nevicate intense", "☁"],
            77: ["Granuli di neve", "☁"],
            80: ["Rovesci", "🌧"], 81: ["Rovesci", "🌧"], 82: ["Forti rovesci", "🌧"],
            85: ["Rovesci di neve", "☁"], 86: ["Rovesci di neve intensi", "☁"],
            95: ["Temporale", "⛈"], 96: ["Temporale con grandine", "⛈"], 99: ["Temporale forte", "⛈"]
        };
        const weatherConditionsEnglish = {
            0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Cloudy",
            45: "Fog", 48: "Depositing rime fog",
            51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle",
            56: "Light freezing drizzle", 57: "Dense freezing drizzle",
            61: "Light rain", 63: "Rain", 65: "Heavy rain",
            66: "Light freezing rain", 67: "Heavy freezing rain",
            71: "Light snow", 73: "Snow", 75: "Heavy snow", 77: "Snow grains",
            80: "Rain showers", 81: "Rain showers", 82: "Violent rain showers",
            85: "Snow showers", 86: "Heavy snow showers",
            95: "Thunderstorm", 96: "Thunderstorm with hail", 99: "Heavy thunderstorm with hail"
        };
        const DAILY_WEATHER_ICONS = new Set(["☀", "🌤", "☁", "🌧", "⛈"]);

        function weatherConditionInEnglish(code) {
            if (code == null || !Number.isFinite(Number(code))) return "Unavailable";
            return weatherConditionsEnglish[Number(code)] || "Cloudy";
        }

        function formatWeatherMetric(value, unit) {
            if (value == null || value === "" || !Number.isFinite(Number(value))) return "Non disponibile";
            const formattedValue = Math.round(Number(value));
            return unit === "%" ? `${formattedValue}%` : `${formattedValue} ${unit}`;
        }

        function formatWeatherTime(value) {
            return typeof value === "string" && value.length >= 16
                ? value.slice(11, 16)
                : "Non disponibile";
        }

        function airQualityDescription(value) {
            if (value == null || !Number.isFinite(Number(value))) return "Non disponibile";
            const index = Number(value);
            if (index <= 20) return "Ottima";
            if (index <= 40) return "Discreta";
            if (index <= 60) return "Moderata";
            if (index <= 80) return "Scarsa";
            if (index <= 100) return "Molto scarsa";
            return "Estremamente scarsa";
        }

        function createAirQualityLookup(airQuality) {
            const times = airQuality?.hourly?.time;
            const values = airQuality?.hourly?.european_aqi;
            const hourly = new Map();
            const dailyTotals = new Map();

            if (Array.isArray(times) && Array.isArray(values)) {
                times.forEach((time, index) => {
                    const value = values[index];
                    if (typeof time !== "string" || value == null || !Number.isFinite(Number(value))) return;
                    const numericValue = Number(value);
                    hourly.set(time, numericValue);
                    const date = time.slice(0, 10);
                    const total = dailyTotals.get(date) || { sum: 0, count: 0 };
                    total.sum += numericValue;
                    total.count += 1;
                    dailyTotals.set(date, total);
                });
            }

            const daily = new Map(
                [...dailyTotals].map(([date, total]) => [date, total.sum / total.count])
            );
            return { hourly, daily };
        }

        function hourlyWeatherTooltip(code, reading, airQualityIndex) {
            return [
                weatherCodes[Number(code)]?.[0] || "Non disponibile",
                `Rischio di pioggia: ${formatWeatherMetric(reading.precipitationProbability, "%")}`,
                `Vento: ${formatWeatherMetric(reading.windSpeed, "km/h")}`,
                `Umidità: ${formatWeatherMetric(reading.humidity, "%")}`,
                `Qualità dell'aria: ${airQualityDescription(airQualityIndex)}`
            ].join("\n");
        }

        function dailyWeatherTooltip(code, daily, index, airQualityIndex) {
            return [
                weatherCodes[Number(code)]?.[0] || "Non disponibile",
                `Temperatura minima: ${formatWeatherMetric(daily.temperature_2m_min?.[index], "°C")}`,
                `Temperatura massima: ${formatWeatherMetric(daily.temperature_2m_max?.[index], "°C")}`,
                `Rischio di pioggia: ${formatWeatherMetric(daily.precipitation_probability_max?.[index], "%")}`,
                `Vento medio: ${formatWeatherMetric(daily.wind_speed_10m_mean?.[index], "km/h")}`,
                `Umidità media: ${formatWeatherMetric(daily.relative_humidity_2m_mean?.[index], "%")}`,
                `Qualità dell'aria: ${airQualityDescription(airQualityIndex)}`,
                `Alba: ${formatWeatherTime(daily.sunrise?.[index])}`,
                `Tramonto: ${formatWeatherTime(daily.sunset?.[index])}`
            ].join("\n");
        }

        const DEFAULT_CLOCKS = [{
            id: "default-milano",
            name: "Milano",
            admin1: "Lombardia",
            country: "Italia",
            timezone: "Europe/Rome"
        }];
        const clockSearchInput = document.getElementById("clock-search");
        const clockSuggestions = document.getElementById("clock-suggestions");
        const clockSearchStatus = document.getElementById("clock-search-status");
        const clockGrid = document.getElementById("clock-grid");
        const weatherSearchInput = document.getElementById("weather-search");
        const weatherSuggestions = document.getElementById("weather-suggestions");
        const weatherSearchStatus = document.getElementById("weather-search-status");
        const clockElements = new Map();
        const clockFormatters = new Map();
        let clockResizeObserver = null;
        let clocks = loadClocks();
        let clockSearchTimer = null;
        let clockSearchRequest = 0;
        let clockSearchResults = [];
        let clockSuggestionIndex = -1;
        let weatherSearchTimer = null;
        let weatherSearchRequest = 0;
        let weatherSearchResults = [];
        let weatherSuggestionIndex = -1;

        function isValidTimeZone(timezone) {
            if (typeof timezone !== "string" || !timezone) return false;
            try {
                new Intl.DateTimeFormat("it-IT", { timeZone: timezone });
                return true;
            } catch {
                return false;
            }
        }

        function loadClocks() {
            try {
                const saved = JSON.parse(localStorage.getItem("dashboard-clocks"));
                if (Array.isArray(saved)) {
                    const valid = saved.filter(clock =>
                        clock && typeof clock.name === "string" &&
                        typeof clock.timezone === "string" && isValidTimeZone(clock.timezone)
                    ).slice(0, 4).map(clock => ({
                        id: String(clock.id || `${clock.name}-${clock.timezone}`),
                        name: clock.name,
                        admin1: typeof clock.admin1 === "string" ? clock.admin1 : "",
                        country: typeof clock.country === "string" ? clock.country : "",
                        timezone: clock.timezone
                    }));
                    if (valid.length) return valid;
                }
            } catch {
                return DEFAULT_CLOCKS.slice();
            }
            return DEFAULT_CLOCKS.slice();
        }

        function saveClocks() {
            localStorage.setItem("dashboard-clocks", JSON.stringify(clocks));
        }

        function clockLocationLabel(clock) {
            return [clock.name, clock.admin1, clock.country]
                .filter((part, index, parts) => part && parts.indexOf(part) === index)
                .join(", ");
        }

        function setClockSuggestionsOpen(open) {
            clockSuggestions.hidden = !open;
            clockSearchInput.setAttribute("aria-expanded", String(open));
        }

        function resizeClockFaces() {
            clockElements.forEach(({ face }) => {
                const card = face.closest(".clock-card");
                const header = card.querySelector(".clock-card-header");
                const time = card.querySelector(".clock-time");
                const styles = getComputedStyle(card);
                const horizontalPadding = parseFloat(styles.paddingLeft) + parseFloat(styles.paddingRight);
                const verticalPadding = parseFloat(styles.paddingTop) + parseFloat(styles.paddingBottom);
                const availableWidth = card.clientWidth - horizontalPadding;
                const availableHeight = card.clientHeight - verticalPadding -
                    header.offsetHeight - time.offsetHeight;
                const size = Math.max(0, Math.min(142, availableWidth, availableHeight));
                face.style.width = `${size}px`;
                face.style.height = `${size}px`;
            });
        }

        function updateWorldClocks() {
            const now = new Date();
            clockElements.forEach(({ clock, face, time }) => {
                let formatter = clockFormatters.get(clock.timezone);
                if (!formatter) {
                    formatter = new Intl.DateTimeFormat("it-IT", {
                        timeZone: clock.timezone,
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit",
                        hourCycle: "h23"
                    });
                    clockFormatters.set(clock.timezone, formatter);
                }
                const parts = {};
                formatter.formatToParts(now).forEach(part => {
                    if (part.type !== "literal") parts[part.type] = Number(part.value);
                });
                const hour = parts.hour || 0;
                const minute = parts.minute || 0;
                const second = parts.second || 0;
                face.style.setProperty("--hour-angle", `${((hour % 12) + minute / 60) * 30}deg`);
                face.style.setProperty("--minute-angle", `${(minute + second / 60) * 6}deg`);
                face.style.setProperty("--second-angle", `${second * 6}deg`);
                time.textContent = formatter.format(now);
            });
        }

        function renderWorldClocks() {
            if (clockResizeObserver) {
                clockGrid.querySelectorAll(".clock-card").forEach(card => clockResizeObserver.unobserve(card));
            }
            clockGrid.replaceChildren();
            clockElements.clear();
            clockGrid.dataset.count = String(clocks.length);
            clockSearchInput.disabled = clocks.length >= 4;
            clockSearchInput.placeholder = clocks.length >= 4 ? "Massimo 4 orologi" : "Cerca una città...";
            if (clocks.length >= 4) setClockSuggestionsOpen(false);

            clocks.forEach(clock => {
                const card = document.createElement("article");
                card.className = "clock-card";

                const header = document.createElement("div");
                header.className = "clock-card-header";
                const place = document.createElement("strong");
                place.className = "clock-place";
                place.textContent = clockLocationLabel(clock);
                header.appendChild(place);

                if (clocks.length > 1) {
                    const remove = document.createElement("button");
                    remove.className = "clock-remove";
                    remove.type = "button";
                    remove.textContent = "×";
                    remove.setAttribute("aria-label", `Rimuovi l'orologio di ${clockLocationLabel(clock)}`);
                    remove.addEventListener("click", () => {
                        clocks = clocks.filter(item => item.id !== clock.id);
                        saveClocks();
                        renderWorldClocks();
                        clockSearchStatus.textContent = "Orologio rimosso.";
                    });
                    header.appendChild(remove);
                }

                const face = document.createElement("div");
                face.className = "clock-face";
                face.setAttribute("aria-hidden", "true");
                ["12", "3", "6", "9"].forEach(number => {
                    const marker = document.createElement("span");
                    marker.className = `clock-number clock-number-${number}`;
                    marker.textContent = number;
                    face.appendChild(marker);
                });
                [1, 2, 4, 5, 7, 8, 10, 11].forEach(hour => {
                    const marker = document.createElement("span");
                    marker.className = "clock-hour-mark";
                    marker.style.setProperty("--mark-angle", `${hour * 30}deg`);
                    face.appendChild(marker);
                });
                ["hour", "minute", "second"].forEach(handType => {
                    const hand = document.createElement("span");
                    hand.className = `clock-hand ${handType}`;
                    face.appendChild(hand);
                });

                const time = document.createElement("time");
                time.className = "clock-time";
                card.append(header, face, time);
                clockGrid.appendChild(card);
                if (clockResizeObserver) clockResizeObserver.observe(card);
                clockElements.set(clock.id, { clock, face, time });
            });

            resizeClockFaces();
            updateWorldClocks();
            requestAnimationFrame(resizeClockFaces);
        }

        function renderClockSuggestions(results) {
            clockSearchResults = results;
            clockSuggestionIndex = -1;
            clockSuggestions.replaceChildren();

            if (!results.length) {
                setClockSuggestionsOpen(false);
                clockSearchStatus.textContent = "Nessuna località trovata.";
                return;
            }

            results.forEach((place, index) => {
                const option = document.createElement("button");
                option.className = "clock-suggestion";
                option.type = "button";
                option.setAttribute("role", "option");
                option.setAttribute("aria-selected", "false");

                const name = document.createElement("strong");
                name.textContent = place.name;
                const details = document.createElement("span");
                details.textContent = [place.admin1, place.country, place.timezone]
                    .filter(Boolean)
                    .join(" · ");
                option.append(name, details);
                option.addEventListener("mousedown", event => event.preventDefault());
                option.addEventListener("click", () => addWorldClock(index));
                clockSuggestions.appendChild(option);
            });

            clockSearchStatus.textContent = "Seleziona una località per aggiungere l'orologio.";
            setClockSuggestionsOpen(true);
        }

        async function geocodePlaces(query, count = 8) {
            const response = await fetch(
                `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=${count}&language=it&format=json`
            );
            if (!response.ok) throw new Error("Ricerca località non disponibile.");
            const data = await response.json();
            return Array.isArray(data.results) ? data.results : [];
        }

        async function searchWorldPlaces(query, requestNumber) {
            try {
                const places = await geocodePlaces(query);
                if (requestNumber !== clockSearchRequest) return;

                const results = places
                    .filter(place => place.name && isValidTimeZone(place.timezone))
                    .map(place => ({
                        id: String(place.id || `${place.name}-${place.admin1 || ""}-${place.country || ""}-${place.timezone}`),
                        name: place.name,
                        admin1: place.admin1 || "",
                        country: place.country || "",
                        timezone: place.timezone
                    }))
                    .filter(place => !clocks.some(clock =>
                        clock.id === place.id ||
                        (clock.name === place.name && clock.admin1 === place.admin1 &&
                            clock.country === place.country && clock.timezone === place.timezone)
                    ));
                renderClockSuggestions(results);
            } catch (error) {
                if (requestNumber === clockSearchRequest) {
                    clockSearchStatus.textContent = error.message || "Ricerca località non disponibile.";
                    setClockSuggestionsOpen(false);
                }
            }
        }

        function addWorldClock(index) {
            const place = clockSearchResults[index];
            if (!place) return;
            if (clocks.length >= 4) {
                clockSearchStatus.textContent = "Puoi aggiungere al massimo 4 orologi.";
                setClockSuggestionsOpen(false);
                return;
            }

            clocks.push(place);
            saveClocks();
            clockSearchInput.value = "";
            clockSearchResults = [];
            setClockSuggestionsOpen(false);
            renderWorldClocks();
            clockSearchStatus.textContent = `${clockLocationLabel(place)} aggiunta.`;
        }

        clockSearchInput.addEventListener("input", () => {
            const query = clockSearchInput.value.trim();
            clockSearchRequest += 1;
            const requestNumber = clockSearchRequest;
            clearTimeout(clockSearchTimer);
            clockSearchResults = [];
            clockSuggestions.replaceChildren();
            setClockSuggestionsOpen(false);

            if (query.length < 2) {
                clockSearchStatus.textContent = query ? "Digita almeno 2 caratteri." : "";
                return;
            }

            clockSearchStatus.textContent = "Ricerca località...";
            clockSearchTimer = setTimeout(() => searchWorldPlaces(query, requestNumber), 250);
        });

        clockSearchInput.addEventListener("keydown", event => {
            if (event.key === "ArrowDown" && clockSearchResults.length) {
                event.preventDefault();
                clockSuggestionIndex = Math.min(clockSuggestionIndex + 1, clockSearchResults.length - 1);
            } else if (event.key === "ArrowUp" && clockSearchResults.length) {
                event.preventDefault();
                clockSuggestionIndex = Math.max(clockSuggestionIndex - 1, 0);
            } else if (event.key === "Escape") {
                setClockSuggestionsOpen(false);
                return;
            } else if (event.key === "Enter" && !clockSuggestions.hidden && clockSearchResults.length) {
                event.preventDefault();
                addWorldClock(clockSuggestionIndex < 0 ? 0 : clockSuggestionIndex);
                return;
            } else {
                return;
            }

            clockSuggestions.querySelectorAll(".clock-suggestion").forEach((option, index) => {
                const selected = index === clockSuggestionIndex;
                option.setAttribute("aria-selected", String(selected));
                if (selected) option.scrollIntoView({ block: "nearest" });
            });
        });

        document.addEventListener("pointerdown", event => {
            if (!event.target.closest(".clock-search-box")) setClockSuggestionsOpen(false);
        });

        function setWeatherSuggestionsOpen(open) {
            weatherSuggestions.hidden = !open;
            weatherSearchInput.setAttribute("aria-expanded", String(open));
        }

        function renderWeatherSuggestions(results) {
            weatherSearchResults = results;
            weatherSuggestionIndex = -1;
            weatherSuggestions.replaceChildren();

            if (!results.length) {
                setWeatherSuggestionsOpen(false);
                weatherSearchStatus.textContent = "Nessuna località trovata.";
                return;
            }

            results.forEach((place, index) => {
                const option = document.createElement("button");
                option.className = "clock-suggestion";
                option.type = "button";
                option.setAttribute("role", "option");
                option.setAttribute("aria-selected", "false");

                const name = document.createElement("strong");
                name.textContent = place.name;
                const details = document.createElement("span");

        async function searchWeatherPlaces(query, requestNumber) {
            try {
                const places = await geocodePlaces(query);
                if (requestNumber !== weatherSearchRequest) return;

                const results = places
                    .filter(place =>
                        place.name &&
                        Number.isFinite(Number(place.latitude)) &&
                        Number.isFinite(Number(place.longitude))
                    )
                    .map(place => ({
                        id: String(place.id || `${place.name}-${place.latitude}-${place.longitude}`),
                        name: place.name,
                        admin1: place.admin1 || "",
                        country: place.country || "",
                        timezone: place.timezone || "",
                        latitude: Number(place.latitude),
                        longitude: Number(place.longitude)
                    }));
                renderWeatherSuggestions(results);
            } catch (error) {
                if (requestNumber === weatherSearchRequest) {
                    weatherSearchStatus.textContent = error.message || "Ricerca località non disponibile.";
                    setWeatherSuggestionsOpen(false);
                }
            }

        function renderHourlyForecast(hourly, currentTime, airQualityLookup) {

            const times = Array.isArray(hourly?.time) ? hourly.time : [];

                    weatherCode: hourly.weather_code?.[index] == null
                        ? null
                        : Number(hourly.weather_code[index]),
                    isDay: hourly.is_day?.[index] == null
                        ? true
                        : Number(hourly.is_day[index]) === 1,
                    precipitationProbability: hourly.precipitation_probability?.[index],
                    windSpeed: hourly.wind_speed_10m?.[index],

        let currentWeatherPlace = null;

        function scheduleWeatherHourRefresh(offsetSeconds) {
            clearTimeout(weatherHourRefreshTimer);
            const offsetMilliseconds = Number(offsetSeconds) * 1000;
            if (!Number.isFinite(offsetMilliseconds)) return;

            const cityLocalTime = Date.now() + offsetMilliseconds;
            const delay = 3600000 - (cityLocalTime % 3600000) + 1000;
            weatherHourRefreshTimer = setTimeout(() => loadWeather(), delay);
        }

        async function loadWeather(location = currentWeatherPlace || "Milano") {
            const requestSequence = ++weatherRequestSequence;
            try {
                let place = location;
                if (typeof location === "string") {
                    const places = await geocodePlaces(location, 1);
                    if (!places.length) throw new Error("Città non trovata.");
                    place = places[0];
                }
                if (requestSequence !== weatherRequestSequence) return;

                const weatherUrl =
                    `https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}` +
                    "&current=temperature_2m,weather_code" +
                    "&hourly=temperature_2m,weather_code,is_day,precipitation_probability,wind_speed_10m,relative_humidity_2m" +
                    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_mean,relative_humidity_2m_mean,sunrise,sunset" +
                    "&temperature_unit=celsius&wind_speed_unit=kmh&timezone=auto&forecast_days=6";
                const airQualityUrl =
                    `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${place.latitude}&longitude=${place.longitude}` +
                    "&hourly=european_aqi&timezone=auto&forecast_days=6";
                const [weatherResult, airQualityResult] = await Promise.allSettled([
                    fetch(weatherUrl).then(async response => {
                        if (!response.ok) throw new Error("Previsioni meteo non disponibili.");
                        return response.json();
                    }),
                    fetch(airQualityUrl).then(async response => {
                        if (!response.ok) throw new Error("Qualità dell'aria non disponibile.");
                        return response.json();
                    })
                ]);
                if (weatherResult.status === "rejected") throw weatherResult.reason;
                const weather = weatherResult.value;
                const airQuality = airQualityResult.status === "fulfilled" ? airQualityResult.value : null;
                if (requestSequence !== weatherRequestSequence) return;
                const airQualityLookup = createAirQualityLookup(airQuality);
                const description = weatherCodes[weather.current.weather_code] || ["Nuvoloso", "☁"];

                document.getElementById("location-name").textContent =
                    [place.name, place.admin1, place.country]
                        .filter((part, index, parts) => part && parts.indexOf(part) === index)
                        .join(", ");
                document.getElementById("temperature").textContent =
                    Math.round(weather.current.temperature_2m) + "°";
                const weatherIcon = document.getElementById("weather-icon");
                weatherIcon.textContent = description[1];
                weatherIcon.setAttribute("aria-label", weatherConditionInEnglish(weather.current.weather_code));
                const currentHour = String(weather.current.time || "").slice(0, 13);
                const currentHourIndex = weather.hourly.time.findIndex(time => time.slice(0, 13) === currentHour);
                const currentHourlyTime = weather.hourly.time[currentHourIndex];
                const currentReading = {
                    precipitationProbability: weather.hourly.precipitation_probability?.[currentHourIndex],
                    windSpeed: weather.hourly.wind_speed_10m?.[currentHourIndex],
                    humidity: weather.hourly.relative_humidity_2m?.[currentHourIndex]
                };
                weatherIcon.title = hourlyWeatherTooltip(
                    weather.current.weather_code,
                    currentReading,
                    airQualityLookup.hourly.get(currentHourlyTime)
                );
                if (!renderHourlyForecast(weather.hourly, weather.current.time, airQualityLookup)) {
                    throw new Error("Previsioni orarie per le prossime 12 ore non disponibili.");
                }

                const forecast = document.getElementById("forecast");
                forecast.replaceChildren();
                for (let index = 1; index < weather.daily.time.length; index += 1) {
                    const date = weather.daily.time[index];
                    const descriptionForDay = weatherCodes[weather.daily.weather_code[index]] ||
                        ["Nuvoloso", "☁"];
                    const dayName = new Date(date + "T12:00:00")
                        .toLocaleDateString("it-IT", { weekday: "short" });
                    const day = document.createElement("div");
                    day.className = "forecast-day";
                    const label = document.createElement("span");
                    label.textContent = dayName;
                    const icon = document.createElement("span");

                    icon.textContent = DAILY_WEATHER_ICONS.has(descriptionForDay[1])

                        : "☁";
                    icon.setAttribute("role", "img");
                    icon.setAttribute("aria-label", weatherConditionInEnglish(weather.daily.weather_code[index]));
                    icon.title = dailyWeatherTooltip(
                        weather.daily.weather_code[index],

                        index,
                        airQualityLookup.daily.get(date)
                    );
                    const temperatures = document.createElement("span");
                    temperatures.className = "forecast-temp";
                    const minimum = Math.round(weather.daily.temperature_2m_min[index]);
                    const maximum = Math.round(weather.daily.temperature_2m_max[index]);
                    temperatures.setAttribute("aria-label", `Minima ${minimum}°, massima ${maximum}°`);
                    const minimumLabel = document.createElement("span");
                    minimumLabel.textContent = `L: ${minimum}°`;
                    const maximumLabel = document.createElement("span");
                    maximumLabel.textContent = `H: ${maximum}°`;
                    temperatures.append(minimumLabel, maximumLabel);
                    day.append(label, icon, temperatures);
                    forecast.appendChild(day);
                }
                currentWeatherPlace = place;
                scheduleWeatherHourRefresh(weather.utc_offset_seconds);
                return true;
            } catch (error) {
                if (requestSequence !== weatherRequestSequence) return false;
                weatherSearchStatus.textContent =
                    error.message || "Impossibile caricare le previsioni meteo.";
                return false;
            }
        }

        function heatColor(change) {
            const magnitude = Number.isFinite(change) ? Math.min(5, Math.abs(change)) : 0;
            const hue = change > 0 ? 135 : 0;
            const saturation = magnitude === 0 ? 0 : Math.min(100, 65 + magnitude * 15);
            const lightness = 18 + magnitude * 1.4;
            return `hsl(${hue} ${saturation}% ${lightness}%)`;
        }

        function calculateHeatmapRows(count, aspectRatio) {
            if (count < 4) return 1;

            let bestRows = 1;
            let bestScore = Infinity;
            for (let rows = 1; rows <= count; rows += 1) {
                const columns = Math.ceil(count / rows);
                const cellAspect = aspectRatio * rows / columns;
                const score = Math.abs(cellAspect - 1.35);
                if (score < bestScore) {
                    bestRows = rows;
                    bestScore = score;
                }
            }
            return bestRows;
        }

        function renderHeatmap() {
            const heatmap = document.getElementById("heatmap");
            const count = stocks.length;
            heatmap.replaceChildren();
            stockTileElements.clear();
            if (!count) {
                heatmap.style.setProperty("--row-count", "1");
                return;
            }

            const bounds = heatmap.getBoundingClientRect();
            const aspectRatio = bounds.height > 0 ? bounds.width / bounds.height : 1.4;
            const rowCount = calculateHeatmapRows(count, aspectRatio);
            const estimatedCellHeight = (bounds.height - 7 * (rowCount - 1)) / rowCount;
            heatmap.style.setProperty("--row-count", String(rowCount));

            let stockIndex = 0;
            const stocksPerRow = Math.floor(count / rowCount);
            const extraStocks = count % rowCount;
            for (let rowIndex = 0; rowIndex < rowCount; rowIndex += 1) {
                const row = document.createElement("div");
                row.className = "heatmap-row";
                heatmap.appendChild(row);
                const rowStockCount = stocksPerRow + (rowIndex < extraStocks ? 1 : 0);
                const estimatedCellWidth = (bounds.width - 7 * (rowStockCount - 1)) / rowStockCount;

                for (let cellIndex = 0; cellIndex < rowStockCount; cellIndex += 1) {
                    const stock = stocks[stockIndex];
                    stockIndex += 1;
                    const hasChange = Number.isFinite(stock.change);
                    const change = hasChange
                        ? `${stock.change >= 0 ? "+" : ""}${stock.change.toFixed(2)}%`
                        : "Non disponibile";
                    const details = `${stock.name}\nCodice: ${stock.symbol}\nVariazione giornaliera: ${change}`;
                    const tile = document.createElement("button");
                    tile.className = "stock-tile";
                    if (estimatedCellWidth < 150 || estimatedCellHeight < 90) {
                        tile.classList.add("compact");
                    }
                    if (estimatedCellWidth < 82 || estimatedCellHeight < 54) {
                        tile.classList.add("micro");
                    }
                    tile.type = "button";
                    tile.title = details;
                    tile.setAttribute("aria-label", `${details}\n× per rimuovere dalla heatmap`.replace(/\n/g, ". "));
                    tile.dataset.symbol = stock.symbol;
                    tile.style.background = heatColor(hasChange ? stock.change : 0);

                    const name = document.createElement("strong");
                    name.textContent = stock.name;
                    const symbol = document.createElement("span");
                    symbol.className = "stock-symbol";
                    symbol.textContent = stock.symbol;
                    const changeLabel = document.createElement("span");
                    changeLabel.className = "stock-change";
                    changeLabel.textContent = hasChange ? change : "--";
                    const removeLabel = document.createElement("small");
                    removeLabel.textContent = "×";
                    removeLabel.setAttribute("aria-hidden", "true");
                    tile.append(name, symbol, changeLabel, removeLabel);
                    stockTileElements.set(stock.symbol, tile);

                    tile.addEventListener("click", () => {
                        unsubscribeStockQuote(stock);
                        stocks = stocks.filter(item => item.symbol !== stock.symbol);
                        saveStocks();
                        renderHeatmap();
                    });
                    row.appendChild(tile);
                }
            }
        }

        function cancelStockSearchSubscription() {
            if (stockSearchTimeout) {
                clearTimeout(stockSearchTimeout);
                stockSearchTimeout = null;
            }
            if (stockSearchSubscriptionId && tradeRepublicSocket?.readyState === WebSocket.OPEN) {
                tradeRepublicSocket.send(`unsub ${stockSearchSubscriptionId}`);
            }
            if (stockSearchSubscriptionId) {
                tradeRepublicPreviousPayloads.delete(stockSearchSubscriptionId);
            }
            stockSearchSubscriptionId = null;
        }

        function connectToTradeRepublic() {
            if (tradeRepublicSocket?.readyState === WebSocket.OPEN) {
                return Promise.resolve(tradeRepublicSocket);
            }
            if (tradeRepublicConnection) return tradeRepublicConnection;

            tradeRepublicConnection = new Promise((resolve, reject) => {
                let settled = false;
                const socket = new WebSocket("wss://api.traderepublic.com");
                tradeRepublicSocket = socket;

                const fail = message => {
                    if (settled) return;
                    settled = true;
                    clearTimeout(handshakeTimeout);
                    socket.close();
                    reject(new Error(message));
                };

                const handshakeTimeout = setTimeout(
                    () => fail("Connessione a Trade Republic scaduta."),
                    10000
                );

                socket.addEventListener("open", () => {
                    socket.send('connect 31 {"locale":"it","platformId":"webtrading","platformVersion":"chrome - 126.0.0","clientId":"app.traderepublic.com","clientVersion":"5582"}');
                });

                socket.addEventListener("message", event => {
                    const message = String(event.data);
                    if (!settled) {
                        if (message === "connected") {
                            settled = true;
                            clearTimeout(handshakeTimeout);
                            resolve(socket);
                        } else if (message.startsWith("failed")) {
                            fail(`Trade Republic ha rifiutato la connessione (${message}).`);
                        }
                        return;
                    }
                    handleTradeRepublicMessage(message);
                });

                socket.addEventListener("error", () => {
                    fail("Impossibile collegarsi alla ricerca di Trade Republic.");
                });

                socket.addEventListener("close", () => {
                    if (!settled) fail("Trade Republic ha chiuso la connessione.");
                    if (tradeRepublicSocket === socket) tradeRepublicSocket = null;
                    tradeRepublicConnection = null;
                    tradeRepublicSubscriptions.clear();
                    stockQuoteSubscriptions.clear();
                    tradeRepublicPreviousPayloads.clear();
                    stockSearchSubscriptionId = null;
                    stocks.forEach(stock => {
                        stock.change = null;
                        if (stock.isin) stock.quoteError = "Connessione Trade Republic interrotta.";
                    });
                    renderHeatmap();
                    if (stockSearchTimeout) {
                        clearTimeout(stockSearchTimeout);
                        stockSearchTimeout = null;
                    }
                    if (stocks.some(stock => stock.isin) && !tradeRepublicReconnectTimer) {
                        marketStatus.textContent = "Connessione Trade Republic interrotta: nuovo tentativo tra 5 secondi.";
                        tradeRepublicReconnectTimer = setTimeout(() => {
                            tradeRepublicReconnectTimer = null;
                            startTradeRepublicQuotes();
                        }, 5000);
                    }
                });
            });

            const connection = tradeRepublicConnection;
            connection.then(
                () => {
                    if (tradeRepublicConnection === connection) tradeRepublicConnection = null;
                    if (tradeRepublicReconnectTimer) {
                        clearTimeout(tradeRepublicReconnectTimer);
                        tradeRepublicReconnectTimer = null;
                    }
                },
                () => { if (tradeRepublicConnection === connection) tradeRepublicConnection = null; }
            );
            return connection;
        }
