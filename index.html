        function decodeTradeRepublicDelta(previousPayload, deltaPayload) {
            let position = 0;
            const result = [];

            for (const operation of deltaPayload.split("\t")) {
                if (!operation) continue;
                const length = Number(operation.slice(1));
                if (operation[0] === "+") {
                    result.push(decodeURIComponent(operation.slice(1).replace(/\+/g, " ")).trim());
                } else if (operation[0] === "-" || operation[0] === "=") {
                    if (!Number.isInteger(length) || length < 0) {
                        throw new Error("Aggiornamento ticker non valido.");
                    }
                    if (operation[0] === "=") {
                        result.push(previousPayload.slice(position, position + length));
                    }
                    position += length;
                } else {
                    throw new Error("Formato aggiornamento ticker non riconosciuto.");
                }
            }

            return result.join("");
        }

        function handleTradeRepublicSearchResults(response) {
            const uniqueResults = new Map();
            (Array.isArray(response.results) ? response.results : []).forEach(result => {
                if (result.instrumentType === "stock" && result.isin && result.name) {
                    uniqueResults.set(result.isin, {
                        isin: result.isin,
                        name: result.name
                    });
                }
            });
            renderStockSearchResults(Array.from(uniqueResults.values()));
            cancelStockSearchSubscription();
        }

        function handleTradeRepublicMessage(message) {
            const frame = message.match(/^(\d+)\s+([A-Z])(?:\s+([\s\S]*))?$/);
            if (!frame) return;

            const [, subscriptionId, status, framePayload = ""] = frame;
            const stock = tradeRepublicSubscriptions.get(subscriptionId);
            if (status === "C") {
                tradeRepublicPreviousPayloads.delete(subscriptionId);
                tradeRepublicSubscriptions.delete(subscriptionId);
                if (stock) {
                    stockQuoteSubscriptions.delete(stock.isin);
                    stock.quoteError = "Trade Republic ha terminato l'invio delle quotazioni.";
                    marketStatus.textContent = `Quotazione interrotta per ${stock.name}.`;
                    updateStockTile(stock);
                }
                return;
            }

            if (status === "E") {
                let errorMessage = "Trade Republic non ha fornito la quotazione.";
                try {
                    const error = JSON.parse(framePayload)?.errors?.[0]?.errorMessage;
                    if (error) errorMessage = `Trade Republic: ${error}`;
                } catch {
                    errorMessage = "Trade Republic ha restituito un errore non leggibile.";
                }

                if (subscriptionId === stockSearchSubscriptionId) {
                    showStockSearchError("Trade Republic non ha completato la ricerca. Riprova tra poco.");
                    cancelStockSearchSubscription();
                } else if (stock) {
                    stock.quoteError = errorMessage;
                    stockQuoteSubscriptions.delete(stock.isin);
                    tradeRepublicSubscriptions.delete(subscriptionId);
                    tradeRepublicPreviousPayloads.delete(subscriptionId);
                    marketStatus.textContent = `${stock.name}: ${errorMessage}`;
                    updateStockTile(stock);
                }
                return;
            }

            if (status !== "A" && status !== "D") return;

            try {
                const payload = status === "D"
                    ? decodeTradeRepublicDelta(tradeRepublicPreviousPayloads.get(subscriptionId) || "", framePayload)
                    : framePayload;
                tradeRepublicPreviousPayloads.set(subscriptionId, payload);
                const response = JSON.parse(payload);

                if (subscriptionId === stockSearchSubscriptionId) {
                    handleTradeRepublicSearchResults(response);
                    return;
                }

                if (stock) updateStockQuote(stock, response);
            } catch (error) {
                if (subscriptionId === stockSearchSubscriptionId) {
                    showStockSearchError("Risposta di ricerca di Trade Republic non valida.");
                    cancelStockSearchSubscription();
                } else if (stock) {
                    stock.quoteError = error.message || "Risposta ticker non valida.";
                    marketStatus.textContent = `${stock.name}: ${stock.quoteError}`;
                    updateStockTile(stock);
                }
            }
        }

        function updateStockQuote(stock, ticker) {
            const lastPrice = Number(ticker?.last?.price);
            const previousPrice = Number(ticker?.pre?.price);
            const openPrice = Number(ticker?.open?.price);
            const hasPreviousPrice = Number.isFinite(previousPrice) && previousPrice > 0;
            const hasOpenPrice = Number.isFinite(openPrice) && openPrice > 0;
            const referencePrice = hasPreviousPrice && (previousPrice !== lastPrice || !hasOpenPrice)
                ? previousPrice
                : openPrice;
            if (!Number.isFinite(lastPrice) || !Number.isFinite(referencePrice) || referencePrice <= 0) {
                stock.quoteError = "Prezzo o riferimento giornaliero non disponibile.";
                marketStatus.textContent = `${stock.name}: quotazione Trade Republic incompleta.`;
                updateStockTile(stock);
                return;
            }

            stock.change = ((lastPrice - referencePrice) / referencePrice) * 100;
            stock.quoteError = null;
            marketStatus.textContent =
                `Variazioni live Trade Republic · aggiornato ${new Date().toLocaleTimeString("it-IT")}`;
            updateStockTile(stock);
        }

        async function subscribeStockQuote(stock) {
            if (!stock.isin || stockQuoteSubscriptions.has(stock.isin)) return;
            try {
                const socket = await connectToTradeRepublic();
                if (!stocks.includes(stock) || stockQuoteSubscriptions.has(stock.isin)) return;

                const subscriptionId = String(++stockSearchSubscriptionSequence);
                stockQuoteSubscriptions.set(stock.isin, subscriptionId);
                tradeRepublicSubscriptions.set(subscriptionId, stock);
                stock.quoteError = null;
                socket.send(`sub ${subscriptionId} ${JSON.stringify({
                    type: "ticker",
                    id: `${stock.isin}.LSX`
                })}`);
            } catch (error) {
                if (stocks.includes(stock)) {
                    stock.quoteError = error.message || "Connessione Trade Republic non disponibile.";
                    marketStatus.textContent = `${stock.name}: ${stock.quoteError}`;
                    updateStockTile(stock);
                }
            }
        }

        function unsubscribeStockQuote(stock) {
            if (!stock.isin) return;
            const subscriptionId = stockQuoteSubscriptions.get(stock.isin);
            if (!subscriptionId) return;
            if (tradeRepublicSocket?.readyState === WebSocket.OPEN) {
                tradeRepublicSocket.send(`unsub ${subscriptionId}`);
            }
            stockQuoteSubscriptions.delete(stock.isin);
            tradeRepublicSubscriptions.delete(subscriptionId);
            tradeRepublicPreviousPayloads.delete(subscriptionId);
        }

        async function startTradeRepublicQuotes() {
            const eligibleStocks = stocks.filter(stock => stock.isin);
            if (!eligibleStocks.length) {
                marketStatus.textContent = "Nessun ISIN disponibile per le quotazioni Trade Republic.";
                return;
            }

            marketStatus.textContent = "Collegamento alle quotazioni live Trade Republic...";
            await Promise.all(eligibleStocks.map(subscribeStockQuote));
        }

        async function searchTradeRepublic(query, requestNumber) {
            try {
                const socket = await connectToTradeRepublic();
                if (requestNumber !== stockSearchRequest) return;

                cancelStockSearchSubscription();
                const subscriptionId = String(++stockSearchSubscriptionSequence);
                stockSearchSubscriptionId = subscriptionId;
                const queryData = {
                    q: query,
                    page: 1,
                    pageSize: 8,
                    filter: [
                        { key: "type", value: "stock" },
                        { key: "jurisdiction", value: "IT" }
                    ]
                };

                socket.send(`sub ${subscriptionId} ${JSON.stringify({ type: "neonSearch", data: queryData })}`);
                stockSearchTimeout = setTimeout(() => {
                    if (stockSearchSubscriptionId === subscriptionId) {
                        showStockSearchError("La ricerca su Trade Republic non ha risposto. Riprova.");
                        cancelStockSearchSubscription();
                    }
                }, 10000);
            } catch (error) {
                if (requestNumber === stockSearchRequest) {
                    showStockSearchError(error.message || "Ricerca Trade Republic non disponibile.");
                }
            }
        }

        function selectTradeRepublicStock(index) {
            const result = stockSearchResults[index];
            if (!result) return;
            selectedStock = result;
            stockSearchInput.value = result.name;
            stockSearchButton.disabled = false;
            stockSearchStatus.textContent = `${result.name} selezionata · ISIN ${result.isin}`;
            setStockSuggestionsOpen(false);
            stockSearchInput.focus();
        }

        function addSelectedStock() {
            if (!selectedStock) {
                stockSearchStatus.textContent = "Cerca e seleziona un'azione dai risultati di Trade Republic.";
                return;
            }

            if (stocks.some(stock => (stock.isin || stock.symbol) === selectedStock.isin)) {
                stockSearchStatus.textContent = "Questa azione è già presente nella heatmap.";
            } else {
                stocks.push({
                    symbol: selectedStock.isin,
                    isin: selectedStock.isin,
                    name: selectedStock.name,
                    change: null
                });
                saveStocks();
                renderHeatmap();
                const addedStock = stocks[stocks.length - 1];
                subscribeStockQuote(addedStock);
                stockSearchStatus.textContent = `${selectedStock.name} aggiunta alla heatmap.`;
            }

            selectedStock = null;
            stockSearchInput.value = "";
            stockSearchButton.disabled = true;
            stockSearchInput.focus();
        }

        stockSearchInput.addEventListener("input", () => {
            const query = stockSearchInput.value.trim();
            selectedStock = null;
            stockSearchButton.disabled = true;
            stockSearchRequest += 1;
            const requestNumber = stockSearchRequest;
            clearTimeout(stockSearchTimer);
            cancelStockSearchSubscription();
            stockSearchResults = [];
            stockSuggestions.replaceChildren();
            setStockSuggestionsOpen(false);

            if (query.length < 2) {
                stockSearchStatus.textContent = query ? "Digita almeno 2 caratteri." : "";
                return;
            }

            stockSearchStatus.textContent = "Ricerca su Trade Republic...";
            stockSearchTimer = setTimeout(
                () => searchTradeRepublic(query, requestNumber),
                300
            );
        });

        stockSearchInput.addEventListener("keydown", event => {
            if (event.key === "ArrowDown" && stockSearchResults.length) {
                event.preventDefault();
                stockSuggestionIndex = Math.min(stockSuggestionIndex + 1, stockSearchResults.length - 1);
            } else if (event.key === "ArrowUp" && stockSearchResults.length) {
                event.preventDefault();
                stockSuggestionIndex = Math.max(stockSuggestionIndex - 1, 0);
            } else if (event.key === "Escape") {
                setStockSuggestionsOpen(false);
                return;
            } else if (event.key === "Enter" && stockSuggestions.hidden === false && stockSearchResults.length) {
                event.preventDefault();
                selectTradeRepublicStock(stockSuggestionIndex < 0 ? 0 : stockSuggestionIndex);
                return;
            } else {
                return;
            }

            stockSuggestions.querySelectorAll(".stock-suggestion").forEach((option, index) => {
                const selected = index === stockSuggestionIndex;
                option.setAttribute("aria-selected", String(selected));
                if (selected) option.scrollIntoView({ block: "nearest" });
            });
        });

        document.getElementById("stock-form").addEventListener("submit", event => {
            event.preventDefault();
            addSelectedStock();
        });

        renderWorldClocks();
        setInterval(updateWorldClocks, 1000);
        if (typeof ResizeObserver !== "undefined") {
            clockResizeObserver = new ResizeObserver(resizeClockFaces);
            clockResizeObserver.observe(clockGrid);
            clockGrid.querySelectorAll(".clock-card").forEach(card => clockResizeObserver.observe(card));
        } else {
            window.addEventListener("resize", resizeClockFaces);
        }
        renderHeatmap();
        if (typeof ResizeObserver !== "undefined") {
            const heatmapResizeObserver = new ResizeObserver(renderHeatmap);
            heatmapResizeObserver.observe(document.getElementById("heatmap"));
        } else {
            window.addEventListener("resize", renderHeatmap);
        }
        loadWeather();
        setInterval(() => loadWeather(), 15 * 60 * 1000);
        loadNews();
        startTradeRepublicQuotes();
        setInterval(loadNews, 5 * 60 * 1000);
    </script>
</body>
</html>
